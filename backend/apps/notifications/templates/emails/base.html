<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}SmartChair{% endblock %}</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #f4f4f4;
        color: #333;
        font-family: Arial, sans-serif;
      }

      .container {
        max-width: 600px;
        margin: 32px auto;
        overflow: hidden;
        background: #fff;
        border-radius: 8px;
      }

      .header {
        padding: 28px 32px;
        background: #1f4e79;
      }

      .header h1 {
        margin: 0;
        color: #fff;
        font-size: 22px;
      }

      .body {
        padding: 32px;
        line-height: 1.6;
      }

      .btn {
        display: inline-block;
        margin-top: 24px;
        padding: 12px 24px;
        background: #2e75b6;
        border-radius: 6px;
        color: #fff;
        font-weight: bold;
        text-decoration: none;
      }

      .footer {
        padding: 16px 32px;
        background: #f4f4f4;
        color: #888;
        text-align: center;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>SmartChair</h1>
      </div>
      <div class="body">
        {% block content %}{% endblock %}
      </div>
      <div class="footer">
        Universidad Nacional de Loja · Este es un mensaje automatico.
      </div>
    </div>
  </body>
</html>
